<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NOJA'S CREATIONS Admin - Custom Design Requests"
    >

    <title>Requests | NOJA'S CREATIONS Admin</title>


    <!-- =====================================================
         ADMIN CSS
    ====================================================== -->

    <link rel="stylesheet" href="css/admin.css">

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/admin-animations.css"
    >

    <link
        rel="stylesheet"
        href="css/admin-requests.css"
    >


    <!-- =====================================================
         REQUESTS CSS
    ====================================================== -->

    <style>

        .requests-page {
            padding: 30px;
        }

        .requests-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .requests-header h1 {
            margin: 0;
        }

        .requests-header p {
            margin-top: 8px;
            opacity: 0.7;
        }

        .requests-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .request-filter {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .request-filter input,
        .request-filter select {
            min-height: 44px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: var(--dark-card, #151515);
            color: inherit;
            outline: none;
        }

        .request-filter input {
            min-width: 260px;
        }

        .requests-table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
        }

        .requests-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .requests-table th,
        .requests-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .requests-table th {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.7;
        }

        .requests-table tbody tr {
            transition: background 0.2s ease;
        }

        .requests-table tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .request-customer strong {
            display: block;
            margin-bottom: 5px;
        }

        .request-customer small {
            opacity: 0.65;
        }

        .request-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .request-status.pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
        }

        .request-status.reviewed {
            background: rgba(33, 150, 243, 0.15);
            color: #2196f3;
        }

        .request-status.completed {
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
        }

        .request-status.cancelled {
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
        }

        .request-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .request-btn {
            border: 0;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 12px;
            transition: 0.2s ease;
        }

        .request-btn.view {
            background: rgba(255,255,255,0.08);
            color: inherit;
        }

        .request-btn.delete {
            background: rgba(244,67,54,0.12);
            color: #f44336;
        }

        .request-btn:hover {
            transform: translateY(-1px);
        }

        .request-empty,
        .request-loading,
        .request-error {
            padding: 50px 20px;
            text-align: center;
            opacity: 0.7;
        }

        .request-error {
            color: #f44336;
        }


        /* =====================================================
           MODAL
        ====================================================== */

        .request-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.75);
        }

        .request-modal.active {
            display: flex;
        }

        .request-modal-content {
            width: min(850px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #151515;
            border-radius: 16px;
            padding: 30px;
            position: relative;
        }

        .request-modal-close {
            position: absolute;
            top: 15px;
            right: 18px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            background: rgba(255,255,255,0.08);
            color: inherit;
        }

        .request-modal-header {
            padding-right: 45px;
            margin-bottom: 25px;
        }

        .request-modal-header h2 {
            margin: 0 0 8px;
        }

        .request-detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .request-detail {
            padding: 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
        }

        .request-detail.full {
            grid-column: 1 / -1;
        }

        .request-detail-label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.55;
        }

        .request-detail-value {
            line-height: 1.6;
            word-break: break-word;
        }

        .request-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 10px;
        }

        .request-status-control {
            margin-top: 25px;
        }

        .request-status-control label {
            display: block;
            margin-bottom: 8px;
        }

        .request-status-control select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #101010;
            color: inherit;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 768px) {

            .requests-page {
                padding: 20px 15px;
            }

            .requests-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .request-filter {
                flex-direction: column;
            }

            .request-filter input,
            .request-filter select {
                width: 100%;
                min-width: 0;
            }

            .request-detail-grid {
                grid-template-columns: 1fr;
            }

            .request-detail.full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header id="adminHeader"></header>


    <!-- =====================================================
         ADMIN LAYOUT
    ====================================================== -->

    <div class="admin-layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside id="adminSidebar"></aside>


        <!-- =================================================
             MAIN
        ================================================== -->

        <main class="admin-main">


            <section class="requests-page">


                <!-- =========================================
                     PAGE HEADER
                ========================================== -->

                <div class="requests-header">

                    <div>

                        <span class="section-label">
                            CUSTOMER MANAGEMENT
                        </span>

                        <h1>
                            Custom Design Requests
                        </h1>

                        <p>
                            Review and manage customer design requests.
                        </p>

                    </div>

                </div>


                <!-- =========================================
                     FILTERS
                ========================================== -->

                <div class="request-filter">

                    <input
                        type="search"
                        id="requestSearch"
                        placeholder="Search customer, email or phone..."
                    >


                    <select id="requestStatusFilter">

                        <option value="all">
                            All Requests
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="reviewed">
                            Reviewed
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <!-- =========================================
                     TABLE
                ========================================== -->

                <div class="requests-table-wrapper">

                    <table class="requests-table">

                        <thead>

                            <tr>

                                <th>
                                    Customer
                                </th>

                                <th>
                                    Design
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Budget
                                </th>

                                <th>
                                    Occasion
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>

                        <tbody id="requestsTableBody">

                            <tr>

                                <td
                                    colspan="8"
                                    class="request-loading"
                                >
                                    Loading requests...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


            </section>


        </main>

    </div>


    <!-- =====================================================
         REQUEST DETAILS MODAL
    ====================================================== -->

    <div
        id="requestModal"
        class="request-modal"
    >

        <div class="request-modal-content">

            <button
                type="button"
                class="request-modal-close"
                id="requestModalClose"
            >
                ×
            </button>


            <div id="requestModalBody"></div>

        </div>

    </div>

<!-- =====================================================
     ADMIN JAVASCRIPT
====================================================== -->

<script src="js/auth.js"></script>

<script src="js/admin.js"></script>

<script src="js/custom-design-requests.js"></script>

</body>
</html>
